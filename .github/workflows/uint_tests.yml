name: Unit Tests
on:
  push:
    branches: [ '*' ]

jobs:
  Unit_Tests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # Host and ScriptVM suites compile the committed generated mirrors under
    # src/ (flags, opcodes), so they need no generator run and no FX tooling.
    - name: Host C++ suites
      run: make test

    - name: ScriptVM suites
      run: make testvm
