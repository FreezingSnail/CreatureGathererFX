# Native cgfx-tools source order. This preserves committed legacy Sprite.txt declarations.

[[set]]
output = "fxdata/Sprites.txt"
images = [
  "images/numbersblack_7x8.png", "images/creatureSprites_32x32.png",
  "images/fieldBacground_128x32.png", "images/characterSheet_16x16.png",
  "images/NewecreatureSprites_32x32.png", "images/numberswhite_7x8.png",
  "images/singlenumberswhite_3x8.png", "images/fightMenu_128x24.png",
  "images/singlenumbersblack_3x8.png", "images/ArduFont_5x6.png",
