# --- Beta world trainers. Each entry binds persona/rate and original-slot
# retypes to one canonical authored opponent row (matched by species triple).
# Gameplay levels/kits stay in data/opponents.csv; this layer only overrides the
# duel AI persona and matchup retypes.

[[trainer]]
trainer_species = ["squibblesnail", "skittercrab", "squid"]
persona = "reader"

[[trainer]]
trainer_species = ["bell", "hedge", "cloud"]
persona = "frequency"

[[trainer]]
trainer_species = ["rock", "shattercrab", "biggestsquid"]
persona = "reader"
rate = 50

[[trainer]]
trainer_species = ["ardu", "dragon", "skull"]
persona = "anti_repeat"
[[trainer.member]]
slot = 0
types = ["fire"]
