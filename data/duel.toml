# Five-type duel authoring (CreatureGathererFX-d73i.4).
#
# Single machine source for the duel fold, the demo sample/retyped teams and the
# beta trainer persona/rate/overrides. `make gen` folds the authored 8-type
# roster to the five duel types and emits compact duel records; saved/custom
# kits stay authoritative and are never replaced by species defaults.
#
# The fold order and mapping are the device-pinned five-type contract
# (mock/matrices.js id "5"); the authored source may only restate them.

[fold]
order = ["spirit", "water", "earth", "fire", "plant"]
[fold.map]
spirit = "spirit"
water = "water"
wind = "water"
earth = "earth"
fire = "fire"
lightning = "fire"
plant = "plant"
elder = "spirit"

# Default persona read rates. All stay below the 75% cap; beta trainers may
# override per row and the demo uses [demo] below.
[personas]
random = 0
reader = 25
frequency = 50
anti_repeat = 50

# Canonical mock demo window: reader @ 45% (mock/duel-bonus.html defaults).
[demo]
persona = "reader"
rate = 45

# --- Demo sample/retyped teams (mirror mock/teams.js). Both arena sides offer
# all five plus a seeded random full-roster 3v3. Members keep their own native
# default kits and stats; `types` drive only the matchup layer. Authored at
# level 8 to match the mock SPIKE_LEVEL and the canonical HP formula.

[[team]]
key = "balanced"
label = "Balanced trio"
[[team.member]]
species = "squid"
level = 8
types = ["water"]
[[team.member]]
species = "SkitterCrab"
level = 8
types = ["earth"]
[[team.member]]
species = "hedge"
level = 8
types = ["plant"]

[[team]]
